services:
  - type: web
    name: gangstar-remote
    runtime: python
    plan: free
    region: singapore          # change to frankfurt/singapore for lower latency to targets

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements_render.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --log-level warning --ws-max-size 4194304 --ws-ping-interval 30 --ws-ping-timeout 60 --timeout-keep-alive 60

    # Render's auto-deploy on git push
    autoDeploy: true

    # Health check — FastAPI returns 200 on /
    healthCheckPath: /

    # Environment variables — set SECRET_KEY and DATABASE_URL in Render dashboard
    # Never commit real values here
    envVars:
      # ── Core ──────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true          # Render generates a secure random value

      - key: DATABASE_URL
        fromDatabase:
          name: gangstar-db
          property: connectionString  # injected from the db block below

      # ── Server identity ───────────────────────────────────────────────────
      # Render exposes your service at https://<name>.onrender.com
      # Set SERVER_URL and SERVER_WS_URL after first deploy when you know the URL.
      - key: SERVER_URL
        value: https://gangstar-remote.onrender.com   # update after first deploy

      - key: SERVER_WS_URL
        value: wss://gangstar-remote.onrender.com/ws  # update after first deploy

      # ── Port (Render sets $PORT; gangstar_env reads GANGSTAR_PORT as fallback) ─
      # uvicorn is launched with --port $PORT directly, so GANGSTAR_PORT is only
      # used by the __main__ block which never runs on Render.
      - key: GANGSTAR_PORT
        value: "10000"               # kept for gangstar_env compatibility; actual port comes from $PORT

      - key: GANGSTAR_HOST
        value: "0.0.0.0"

      - key: GANGASTAR_HOST
        value: "0.0.0.0"

      - key: GANGASTAR_UVICORN_WORKERS
        value: "1"                   # Render free/starter = 1 vCPU; bump on bigger plan

      - key: FRAME_TTL_SECONDS
        value: "60"

      - key: HIERARCHY_TTL_SECONDS
        value: "30"

      - key: DASHBOARD_QUEUE_SIZE
        value: "10"

      # ── Telegram (optional — only if telegram_crypter is active) ──────────
      # - key: TELEGRAM_API_ID
      #   sync: false
      # - key: TELEGRAM_API_HASH
      #   sync: false
      # - key: TELEGRAM_BOT_TOKEN
      #   sync: false

      # ── Python ────────────────────────────────────────────────────────────
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

    # Persistent disk for SQLite WAL + frame cache (optional — use PostgreSQL instead)
    # If you use PostgreSQL (recommended), remove this disk block entirely.
    # disk:
    #   name: gangstar-data
    #   mountPath: /data
    #   sizeGB: 1

databases:
  - name: gangstar-db
    databaseName: gangstar
    user: gangstar
    plan: free                       # upgrade to starter for persistent storage beyond 90 days
