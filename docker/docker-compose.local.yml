services:
  spyhexrat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: spyhexrat:local
    container_name: spyhexrat
    ports:
      - "32766:32766"
    volumes:
      - spyhexrat-data:/app/backend/data
    environment:
      - NODE_ENV=production
      - FASON_TRUST_PROXY=1
    env_file:
      - path: ../.env
        required: false
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  spyhexrat-data:
    driver: local
